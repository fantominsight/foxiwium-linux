# Foxiwium OS - GRUB Configuration (BIOS)
set timeout=3
set default=0

set gfxpayload=1280x720x32

menuentry "Foxiwium" {
    videoinfo
    set gfxpayload=1280x720x32
    multiboot2 /boot/foxiwium.bin
    module2 /boot/initramfs.img
    boot
}

menuentry "Foxiwium (Serial Debug)" {
    set gfxpayload=1280x720x32
    multiboot2 /boot/foxiwium.bin serial
    module2 /boot/initramfs.img
    boot
}
