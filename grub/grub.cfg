# Foxiwium Linux — GRUB configuration (BIOS + UEFI, via grub-mkrescue)

set timeout=3
set default=0

if loadfont unicode ; then
    set gfxmode=auto
    insmod all_video
fi
terminal_output gfxterm
set color_normal=white/black
set color_highlight=yellow/black

menuentry "Foxiwium Linux 1.0 (Fenrir) — live" {
    linux /live/vmlinuz boot=live quiet console=tty0 console=ttyS0,115200n8
    initrd /live/initrd.img
}

# Boots the live system, auto-logs in and launches the graphical installer
# (calamares) automatically.
menuentry "Foxiwium Linux 1.0 (Fenrir) — install to hard disk" {
    linux /live/vmlinuz boot=live quiet foxiwium-install console=tty0 console=ttyS0,115200n8
    initrd /live/initrd.img
}

menuentry "Foxiwium Linux — serial console only" {
    linux /live/vmlinuz boot=live console=ttyS0,115200n8
    initrd /live/initrd.img
}

menuentry "Foxiwium Linux — verbose boot" {
    linux /live/vmlinuz boot=live
    initrd /live/initrd.img
}
