# Foxiwium — NVIDIA GeForce GT 210 (and similar pre-Wayland GPUs).
#
# The open-source nouveau kernel driver is used (the proprietary nvidia
# driver is EOL for this card and has been removed from Debian). Xorg's
# "modesetting" driver pairs with the nouveau kernel modesetting and is the
# recommended, maintained combination — acceleration (DRI) works out of the
# box. Wayland is not used: GT 210 has no usable GL for it.

Section "Device"
    Identifier "NVIDIA GT 210 (nouveau)"
    Driver     "modesetting"
    Option     "DRI" "3"
    Option     "AccelMethod" "glamor"
EndSection
