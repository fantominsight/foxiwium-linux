# Foxiwium — SDDM: default to the Plasma X11 session (startplasma-x11).
# Wayland is intentionally NOT offered: the target GPU (NVIDIA GT 210 via
# nouveau) only has usable acceleration on X11. The X11 session entry is
# "plasmax11" (startplasma-x11); the wayland-sessions entry is removed
# during the build.
#
# Autologin is live-only: the calamares foxiwium-finalize step strips the
# Autologin lines from the installed system.

[Users]
DefaultSession=plasmax11

[Theme]
Current=breeze

[Autologin]
User=fox
Session=plasmax11
