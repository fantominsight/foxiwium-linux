# Foxiwium — always prefer SDDM (the only display manager we ship).
---
displaymanagers:
  - sddm

# Force the Plasma X11 session (NVIDIA GT 210 / nouveau: no Wayland).
defaultDesktopEnvironment:
    executable: "startplasma-x11"
    desktopFile: "plasmax11"

basicSetup: false
sysconfigSetup: false
