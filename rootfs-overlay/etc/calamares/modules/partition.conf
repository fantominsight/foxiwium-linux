---
# Default filesystem type for new/replaced partitions.
defaultFileSystemType: "ext4"

# Filesystem types the user can pick when erasing / replacing.
availableFileSystemTypes:
    - ext4
    - btrfs
    - xfs

# Manual partitioning button stays available.
allowManualPartitioning: true

# Swap handling: offer "no swap" too.
userSwapChoices:
    - none
    - small
    - suspend
    - file
